<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 1000" font-family="Segoe UI, Roboto, Arial, sans-serif">
  <rect width="980" height="1000" fill="#f4f5f7"/>
  <!-- dialog card -->
  <rect x="40" y="30" width="600" height="940" rx="10" fill="#ffffff" stroke="#e2e4e8"/>
  <text x="64" y="70" font-size="20" font-weight="700" fill="#1f2937">Optimize SEO</text>
  <text x="64" y="94" font-size="13" fill="#9aa1ab">Odoo standard fields (title, description, preview, keywords, image)…</text>
  <line x1="64" y1="112" x2="616" y2="112" stroke="#eceef1"/>

  <!-- SEO Coach header + scores -->
  <text x="64" y="146" font-size="18" font-weight="700" fill="#6d28d9">SEO Coach</text>
  <g>
    <rect x="360" y="128" width="120" height="30" rx="15" fill="#f1f3f5"/>
    <circle cx="378" cy="143" r="6" fill="#4caf50"/>
    <text x="390" y="147" font-size="12" fill="#333">SEO <tspan font-weight="700">85</tspan>/100</text>
    <rect x="490" y="128" width="126" height="30" rx="15" fill="#f1f3f5"/>
    <circle cx="508" cy="143" r="6" fill="#4caf50"/>
    <text x="520" y="147" font-size="11" fill="#333">Readability <tspan font-weight="700">72</tspan></text>
  </g>

  <!-- keyphrase -->
  <text x="64" y="186" font-size="12" font-weight="600" fill="#374151">Focus keyphrase</text>
  <rect x="64" y="194" width="552" height="30" rx="5" fill="#fafbfc" stroke="#d6dae0"/>
  <text x="76" y="214" font-size="13" fill="#111">corporate flowers dubai</text>
  <text x="64" y="246" font-size="12" font-weight="600" fill="#374151">Related keyphrases</text>
  <rect x="64" y="254" width="552" height="28" rx="5" fill="#fafbfc" stroke="#d6dae0"/>
  <text x="76" y="273" font-size="12" fill="#9aa1ab">office plants, flower delivery</text>
  <rect x="64" y="294" width="14" height="14" rx="3" fill="#6d28d9"/>
  <text x="86" y="306" font-size="12" fill="#374151">Cornerstone content (higher word-count target)</text>

  <!-- SEO analysis -->
  <text x="64" y="340" font-size="11" font-weight="700" fill="#8a93a0" letter-spacing="1">SEO ANALYSIS</text>
  <g font-size="12.5" fill="#2b2f36">
    <circle cx="70" cy="360" r="6" fill="#4caf50"/><text x="86" y="364">Keyphrase is at the start of the SEO title.</text>
    <circle cx="70" cy="384" r="6" fill="#4caf50"/><text x="86" y="388">Keyphrase appears in the first paragraph.</text>
    <circle cx="70" cy="408" r="6" fill="#ee9c13"/><text x="86" y="412">Keyphrase density: 0.4% (aim for 0.5–3%).</text>
    <circle cx="70" cy="432" r="6" fill="#4caf50"/><text x="86" y="436">Meta description length: 148 characters.</text>
    <circle cx="70" cy="456" r="6" fill="#dc3232"/><text x="86" y="460">Keyphrase is missing from the URL slug.</text>
  </g>

  <!-- readability -->
  <text x="64" y="494" font-size="11" font-weight="700" fill="#8a93a0" letter-spacing="1">READABILITY — 612 WORDS</text>
  <g font-size="12.5" fill="#2b2f36">
    <circle cx="70" cy="514" r="6" fill="#4caf50"/><text x="86" y="518">Long sentences: 18% over 20 words.</text>
    <circle cx="70" cy="538" r="6" fill="#4caf50"/><text x="86" y="542">Flesch reading ease: 64/100 (60+ is good).</text>
    <circle cx="70" cy="562" r="6" fill="#ee9c13"/><text x="86" y="566">Complex words: 12% (keep it simple).</text>
  </g>

  <!-- social -->
  <text x="64" y="600" font-size="11" font-weight="700" fill="#8a93a0" letter-spacing="1">SOCIAL (FACEBOOK / X)</text>
  <rect x="64" y="612" width="552" height="26" rx="5" fill="#fafbfc" stroke="#d6dae0"/>
  <text x="76" y="630" font-size="12" fill="#111">Fresh Corporate Flowers, Delivered in Dubai</text>
  <rect x="64" y="644" width="552" height="26" rx="5" fill="#fafbfc" stroke="#d6dae0"/>
  <text x="76" y="662" font-size="12" fill="#9aa1ab">Description shown when shared…</text>
  <rect x="64" y="676" width="552" height="26" rx="5" fill="#fafbfc" stroke="#d6dae0"/>
  <text x="76" y="694" font-size="12" fill="#9aa1ab">/web/image/…  or  https://…</text>

  <!-- schema -->
  <text x="64" y="732" font-size="11" font-weight="700" fill="#8a93a0" letter-spacing="1">SCHEMA (JSON-LD) <tspan fill="#4caf50" font-weight="400">Valid JSON</tspan></text>
  <rect x="64" y="742" width="552" height="60" rx="5" fill="#0f172a"/>
  <text x="76" y="762" font-size="11" fill="#9cdcfe" font-family="monospace">{"@context":"https://schema.org",</text>
  <text x="76" y="778" font-size="11" fill="#9cdcfe" font-family="monospace"> "@type":"Article","headline":"…"}</text>

  <!-- advanced -->
  <text x="64" y="836" font-size="11" font-weight="700" fill="#8a93a0" letter-spacing="1">ADVANCED</text>
  <text x="64" y="858" font-size="12" font-weight="600" fill="#374151">Canonical URL</text>
  <rect x="64" y="866" width="552" height="26" rx="5" fill="#fafbfc" stroke="#d6dae0"/>
  <text x="76" y="884" font-size="12" fill="#9aa1ab">leave empty for the default URL</text>
  <g font-size="12" fill="#374151">
    <rect x="64" y="906" width="13" height="13" rx="3" fill="#6d28d9"/><text x="84" y="917">No index</text>
    <rect x="168" y="906" width="13" height="13" rx="3" fill="#fff" stroke="#b9c0c9"/><text x="188" y="917">No follow</text>
    <rect x="276" y="906" width="13" height="13" rx="3" fill="#fff" stroke="#b9c0c9"/><text x="296" y="917">No archive</text>
    <rect x="388" y="906" width="13" height="13" rx="3" fill="#fff" stroke="#b9c0c9"/><text x="408" y="917">No snippet</text>
    <rect x="500" y="906" width="13" height="13" rx="3" fill="#fff" stroke="#b9c0c9"/><text x="520" y="917">No image index</text>
  </g>
  <rect x="520" y="936" width="96" height="30" rx="5" fill="#6d28d9"/>
  <text x="568" y="956" font-size="13" fill="#fff" text-anchor="middle" font-weight="600">Save</text>

  <!-- numbered callouts -->
  <g font-size="13" font-weight="700" fill="#fff">
    <circle cx="672" cy="143" r="13" fill="#6d28d9"/><text x="672" y="148" text-anchor="middle">1</text>
    <circle cx="672" cy="209" r="13" fill="#6d28d9"/><text x="672" y="214" text-anchor="middle">2</text>
    <circle cx="672" cy="408" r="13" fill="#6d28d9"/><text x="672" y="413" text-anchor="middle">3</text>
    <circle cx="672" cy="538" r="13" fill="#6d28d9"/><text x="672" y="543" text-anchor="middle">4</text>
    <circle cx="672" cy="655" r="13" fill="#6d28d9"/><text x="672" y="660" text-anchor="middle">5</text>
    <circle cx="672" cy="772" r="13" fill="#6d28d9"/><text x="672" y="777" text-anchor="middle">6</text>
    <circle cx="672" cy="879" r="13" fill="#6d28d9"/><text x="672" y="884" text-anchor="middle">7</text>
  </g>
  <g font-size="12.5" fill="#374151">
    <text x="694" y="147">Live SEO + readability scores</text>
    <text x="694" y="213">Focus &amp; related keyphrases</text>
    <text x="694" y="412">SEO checklist (title, URL, density…)</text>
    <text x="694" y="542">Readability checklist (Flesch…)</text>
    <text x="694" y="659">Social share title / text / image</text>
    <text x="694" y="776">JSON-LD schema → page head</text>
    <text x="694" y="883">Canonical URL + robots switches</text>
  </g>
</svg>
