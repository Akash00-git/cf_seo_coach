<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" font-family="DejaVu Sans, Segoe UI, Roboto, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c1d95"/>
      <stop offset="0.55" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1000" height="320" fill="url(#bg)"/>
  <circle cx="930" cy="40" r="150" fill="#ffffff" opacity="0.06"/>
  <circle cx="60" cy="300" r="120" fill="#ffffff" opacity="0.05"/>

  <!-- icon badge: magnifier -->
  <rect x="48" y="96" width="108" height="108" rx="28" fill="#ffffff" opacity="0.16"/>
  <circle cx="92" cy="138" r="24" fill="none" stroke="#ffffff" stroke-width="7"/>
  <line x1="110" y1="156" x2="132" y2="178" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>

  <!-- title + slogan (high contrast white) -->
  <text x="190" y="132" font-size="54" font-weight="800" fill="#ffffff" letter-spacing="0.5">CF SEO Coach</text>
  <text x="192" y="174" font-size="23" fill="#f4eeff">Yoast-style SEO &amp; readability for every Odoo page</text>

  <!-- feature pills: SOLID white with dark text = fully readable -->
  <g font-size="17" font-weight="700" fill="#5b21b6">
    <rect x="190" y="206" width="150" height="40" rx="20" fill="#ffffff"/>
    <text x="265" y="232" text-anchor="middle">Every page</text>

    <rect x="358" y="206" width="244" height="40" rx="20" fill="#ffffff"/>
    <text x="480" y="232" text-anchor="middle">Keyphrase + readability</text>

    <rect x="620" y="206" width="208" height="40" rx="20" fill="#ffffff"/>
    <text x="724" y="232" text-anchor="middle">Schema · Open Graph</text>
  </g>

  <text x="192" y="292" font-size="16" fill="#ece4ff">Free · Odoo 19 · no extra apps · no external libraries</text>

  <!-- live SEO score gauge -->
  <text x="892" y="66" font-size="13" font-weight="700" fill="#ece4ff" text-anchor="middle" letter-spacing="1">LIVE SEO SCORE</text>
  <circle cx="892" cy="150" r="52" fill="none" stroke="#ffffff" stroke-width="13" opacity="0.25"/>
  <circle cx="892" cy="150" r="52" fill="none" stroke="#34d399" stroke-width="13" stroke-linecap="round"
          stroke-dasharray="300 27" transform="rotate(-90 892 150)"/>
  <text x="892" y="162" font-size="40" font-weight="800" fill="#ffffff" text-anchor="middle">92</text>
</svg>
